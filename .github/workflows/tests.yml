name: Tests and distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11.15', '3.14.4']
    runs-on: ${{ matrix.os }}
    env:
      TEST_PYTHON_VERSION: ${{ matrix.python }}
    steps:
      # Action tags resolved against the upstream GitHub API on 2026-10-12.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install interpreter provisioning tool
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.27'
          enable-cache: false
      - name: Provision dedicated environment and build tools
        shell: bash
        run: |
          uv python install --no-bin "$TEST_PYTHON_VERSION"
          test_python="$(uv python find --managed-python "$TEST_PYTHON_VERSION")"
          "$test_python" -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python --version
          .venv/bin/python -m pip install -r tools/requirements-build.txt
          .venv/bin/python -m pip install --no-index --no-build-isolation -e .
          .venv/bin/python -m pip list
      - name: Unit, contract, configuration, and source-export tests
        run: python -m unittest discover
      - name: Generated adapters
        run: |
          specromancy adapters generate --check
          bin/specromancy adapters generate --check
      - name: Build exact artifact set
        run: python -m build --sdist --wheel --no-isolation --outdir "$RUNNER_TEMP/distributions"
      - name: Verify direct wheel and sdist rebuild offline
        run: >-
          python tools/verify_distribution.py
          --wheel "$RUNNER_TEMP/distributions/specromancy_engine-0.1.0-py3-none-any.whl"
          --sdist "$RUNNER_TEMP/distributions/specromancy_engine-0.1.0.tar.gz"
          --log "$RUNNER_TEMP/distribution-verification.log"
      - name: Show retained verification log
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/distribution-verification.log"; then
            cat "$RUNNER_TEMP/distribution-verification.log"
          fi
