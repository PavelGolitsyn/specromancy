[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specromancy-engine"
version = "0.1.0"
description = "Harness-agnostic agentic pipeline framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
specromancy = "specromancy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["specromancy", "specromancy.*"]
namespaces = false

[tool.setuptools.package-data]
specromancy = ["schemas/*.json"]
