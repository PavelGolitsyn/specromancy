[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "specromancy"
version = "0.1.0"
description = "Harness-agnostic tooling for artifact-driven, spec-driven development"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Pavel Golitsyn" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
]

[project.scripts]
specromancy = "specromancy.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"specromancy.resources.contracts" = ["*.json"]
"specromancy.templates" = ["*.md"]
