[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "specromancy"
version = "0.1.0"
description = "Proof-of-concept tooling for durable, artifact-driven development workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Pavel Golitsyn" },
]
dependencies = []
keywords = ["agents", "development-workflow", "specification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/PavelGolitsyn/specromancy"

[project.optional-dependencies]
dev = [
  "build>=1.2",
]

[project.scripts]
specromancy = "specromancy.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"specromancy.resources.contracts" = ["*.json"]
"specromancy.templates" = ["*.md"]
